<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TimeVault | Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    min-height: 100vh;
}

.navbar {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8%;
    border-bottom: 1px solid #183149;
    background: #081522;
}

.logo {
    color: #2dd4bf;
    text-decoration: none;
    font-size: 25px;
    font-weight: bold;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.nav-right span {
    color: #94a3b8;
}

.logout {
    color: #f87171;
    text-decoration: none;
    cursor: pointer;
}

.container {
    width: 84%;
    max-width: 1200px;
    margin: auto;
    padding: 55px 0;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.header h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

.header p {
    color: #94a3b8;
}

.create-btn {
    background: #2dd4bf;
    color: #06121d;
    padding: 13px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 45px;
}

.stat {
    background: #0c1c2b;
    border: 1px solid #1c3a50;
    border-radius: 14px;
    padding: 25px;
}

.stat h3 {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat strong {
    font-size: 30px;
    color: #2dd4bf;
}

.section-title {
    margin-bottom: 20px;
}

.section-title h2 {
    font-size: 24px;
}

.capsules {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.capsule {
    background: #0c1c2b;
    border: 1px solid #1c3a50;
    border-radius: 15px;
    padding: 25px;
}

.capsule-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.capsule h3 {
    font-size: 20px;
}

.badge {
    padding: 6px 10px;
    border-radius: 20px;
    background: #3b2b15;
    color: #fbbf24;
    font-size: 12px;
}

.badge.unlocked {
    background: #103b35;
    color: #5eead4;
}

.capsule-message {
    color: #94a3b8;
    line-height: 1.5;
    margin-bottom: 20px;
}

.details {
    display: flex;
    justify-content: space-between;
    color: #64748b;
    font-size: 13px;
    margin-bottom: 20px;
}

.view-btn {
    display: inline-block;
    color: #2dd4bf;
    text-decoration: none;
    font-weight: bold;
}

.empty {
    background: #0c1c2b;
    border: 1px dashed #29465b;
    border-radius: 15px;
    padding: 50px;
    text-align: center;
}

.empty h3 {
    margin-bottom: 10px;
}

.empty p {
    color: #94a3b8;
    margin-bottom: 20px;
}

@media(max-width: 750px) {
    .stats,
    .capsules {
        grid-template-columns: 1fr;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">TimeVault</a>

    <div class="nav-right">
        <span id="userName"></span>
        <a class="logout" onclick="logout()">Logout</a>
    </div>

</nav>

<div class="container">

    <div class="header">

        <div>
            <h1 id="welcome">Welcome Back</h1>
            <p>Your secure digital capsules.</p>
        </div>

        <a href="create-capsule.html" class="create-btn">
            + Create Capsule
        </a>

    </div>

    <div class="stats">

        <div class="stat">
            <h3>Total Capsules</h3>
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            <h3>Locked</h3>
            <strong id="locked">0</strong>
        </div>

        <div class="stat">
            <h3>Unlocked</h3>
            <strong id="unlocked">0</strong>
        </div>

    </div>

    <div class="section-title">
        <h2>Your Capsules</h2>
    </div>

    <div class="capsules" id="capsules"></div>

</div>

<script>

const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

if (!loggedInUser) {
    window.location.href = "login.html";
}

document.getElementById("welcome").textContent =
    "Welcome back, " + loggedInUser.name;

document.getElementById("userName").textContent =
    loggedInUser.name;

const capsules =
    JSON.parse(localStorage.getItem("timevaultCapsules")) || [];

const userCapsules = capsules.filter(function(capsule) {
    return capsule.userEmail === loggedInUser.email;
});

let lockedCount = 0;
let unlockedCount = 0;

userCapsules.forEach(function(capsule) {

    const unlockTime = new Date(
        capsule.unlockDate + "T" + capsule.unlockTime
    );

    if (new Date() >= unlockTime) {
        unlockedCount++;
    } else {
        lockedCount++;
    }

});

document.getElementById("total").textContent = userCapsules.length;
document.getElementById("locked").textContent = lockedCount;
document.getElementById("unlocked").textContent = unlockedCount;

const container = document.getElementById("capsules");

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

if (userCapsules.length === 0) {

    container.innerHTML = `
        <div class="empty">
            <h3>No Capsules Yet</h3>
            <p>Create your first secure time capsule.</p>
            <a href="create-capsule.html" class="create-btn">
                Create Capsule
            </a>
        </div>
    `;

} else {

    userCapsules.forEach(function(capsule) {

        const unlockTime = new Date(
            capsule.unlockDate + "T" + capsule.unlockTime
        );

        const unlocked = new Date() >= unlockTime;

        const status = unlocked ? "Unlocked" : "Locked";

        container.innerHTML += `

            <div class="capsule">

                <div class="capsule-top">

                    <h3>${escapeHTML(capsule.title)}</h3>

                    <span class="badge ${unlocked ? "unlocked" : ""}">
                        ${status}
                    </span>

                </div>

                <p class="capsule-message">
                    ${escapeHTML(capsule.message.substring(0, 120))}
                    ${capsule.message.length > 120 ? "..." : ""}
                </p>

                <div class="details">

                    <span>
                        📅 ${escapeHTML(capsule.unlockDate)}
                    </span>

                    <span>
                        ⏰ ${escapeHTML(capsule.unlockTime)}
                    </span>

                </div>

                <a
                    class="view-btn"
                    href="capsule.html?id=${encodeURIComponent(capsule.id)}">
                    View Capsule →
                </a>

            </div>

        `;

    });

}

function logout() {

    localStorage.removeItem("loggedInUser");

    window.location.href = "index.html";
}

</script>

</body>
</html>
