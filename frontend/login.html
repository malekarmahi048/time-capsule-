<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TimeVault | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 470px;
    padding: 25px;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo a {
    color: #2dd4bf;
    font-size: 28px;
    font-weight: bold;
    text-decoration: none;
}

.card {
    background: #0c1c2b;
    border: 1px solid #1c3a50;
    border-radius: 18px;
    padding: 35px;
}

.card h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
    line-height: 1.5;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #dbeafe;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #29465b;
    background: #081522;
    color: white;
    outline: none;
}

input:focus {
    border-color: #2dd4bf;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2dd4bf;
    color: #06121d;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #5eead4;
}

.message {
    text-align: center;
    margin-top: 15px;
    color: #f87171;
    font-size: 14px;
}

.bottom-text {
    text-align: center;
    margin-top: 25px;
    color: #94a3b8;
    font-size: 14px;
}

.bottom-text a {
    color: #2dd4bf;
    text-decoration: none;
}

.home {
    text-align: center;
    margin-top: 20px;
}

.home a {
    color: #64748b;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <a href="index.html">TimeVault</a>
    </div>

    <div class="card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to access your secure TimeVault capsules.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Sign In</button>

            <div class="message" id="message"></div>

        </form>

        <div class="bottom-text">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

    </div>

    <div class="home">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    const users = JSON.parse(localStorage.getItem("timevaultUsers")) || [];

    const user = users.find(function(user) {
        return user.email === email && user.password === password;
    });

    if (!user) {
        message.textContent = "Invalid email or password.";
        return;
    }

    localStorage.setItem("loggedInUser", JSON.stringify({
        name: user.name,
        email: user.email
    }));

    window.location.href = "index.html";

});

</script>

</body>
</html>
