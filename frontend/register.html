<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TimeVault | Create Account</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 470px;
    padding: 25px;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo a {
    color: #2dd4bf;
    font-size: 28px;
    font-weight: bold;
    text-decoration: none;
}

.card {
    background: #0c1c2b;
    border: 1px solid #1c3a50;
    border-radius: 18px;
    padding: 35px;
}

.card h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
    line-height: 1.5;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #dbeafe;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #29465b;
    background: #081522;
    color: white;
    outline: none;
}

input:focus {
    border-color: #2dd4bf;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2dd4bf;
    color: #06121d;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-top: 5px;
}

button:hover {
    background: #5eead4;
}

.message {
    margin-top: 15px;
    text-align: center;
    color: #f87171;
    font-size: 14px;
}

.bottom-text {
    text-align: center;
    margin-top: 25px;
    color: #94a3b8;
    font-size: 14px;
}

.bottom-text a {
    color: #2dd4bf;
    text-decoration: none;
}

.home {
    text-align: center;
    margin-top: 20px;
}

.home a {
    color: #64748b;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <a href="index.html">TimeVault</a>
    </div>

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your TimeVault account and start
            securing your future messages.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            </div>

            <button type="submit">Create Account</button>

            <div class="message" id="message"></div>

        </form>

        <div class="bottom-text">
            Already have an account?
            <a href="login.html">Sign In</a>
        </div>

    </div>

    <div class="home">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("message");

    if (password.length < 6) {
        message.textContent = "Password must contain at least 6 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    let users = JSON.parse(localStorage.getItem("timevaultUsers")) || [];

    const existingUser = users.find(user => user.email === email);

    if (existingUser) {
        message.textContent = "An account with this email already exists.";
        return;
    }

    const newUser = {
        name: name,
        email: email,
        password: password
    };

    users.push(newUser);

    localStorage.setItem("timevaultUsers", JSON.stringify(users));

    alert("Account created successfully!");

    window.location.href = "login.html";

});

</script>

</body>
</html>
